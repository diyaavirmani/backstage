<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --deep: #0d1712; --forest: #163c2c; --sage: #edf4e9; --lime: #d3ef9b; --ink: #eef3ed; --muted: #b6c4b8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--deep); font-family: "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #stage { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: var(--deep); }
  .layer { position: absolute; inset: 0; }
  /* Footage */
  #panel { position: absolute; overflow: hidden; background: #f6f7f2; }
  #panel img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; will-change: transform; }
  #searching { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(13,23,18,.55); backdrop-filter: blur(6px); }
  #searching .card { background: var(--deep); border: 1px solid rgba(211,239,155,.35); border-radius: 22px; padding: 34px 48px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  #searching .dots span { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: var(--lime); margin: 0 7px; }
  #searching h3 { font-size: 38px; margin-top: 22px; letter-spacing: -.02em; }
  #searching code { display: block; margin-top: 12px; font: 22px/1.4 Menlo, monospace; color: var(--muted); }
  /* Chrome around footage */
  .chip { position: absolute; display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 999px; background: rgba(13,23,18,.88); color: var(--ink); font-weight: 700; font-size: 26px; letter-spacing: .01em; box-shadow: 0 10px 30px rgba(0,0,0,.25); white-space: nowrap; }
  .chip i { width: 12px; height: 12px; border-radius: 50%; background: var(--lime); display: inline-block; }
  .tag { position: absolute; padding: 12px 22px; border-radius: 14px; background: var(--lime); color: var(--forest); font-weight: 800; font-size: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.25); white-space: nowrap; }
  .tag.outline { background: rgba(13,23,18,.9); color: var(--lime); border: 2px solid var(--lime); }
  #punch { position: absolute; padding: 18px 30px; border-radius: 18px; background: var(--forest); color: var(--ink); font-weight: 800; letter-spacing: -.02em; box-shadow: 0 18px 50px rgba(0,0,0,.35); border-left: 8px solid var(--lime); white-space: nowrap; }
  #caption { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; color: #fff; font-weight: 600; letter-spacing: -.005em; background: rgba(13,23,18,.84); border-radius: 16px; line-height: 1.3; }
  #wipe { position: absolute; top: 0; bottom: 0; width: 140%; left: -140%; background: linear-gradient(90deg, transparent 0, var(--forest) 18%, var(--forest) 70%, var(--lime) 74%, transparent 78%); pointer-events: none; }
  /* Intro */
  #intro { position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, #1d4a36 0, var(--deep) 60%); }
  #grid { position: absolute; inset: -200px; background-image: linear-gradient(rgba(211,239,155,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(211,239,155,.07) 1px, transparent 1px); background-size: 80px 80px; }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .35; }
  .frag { position: absolute; background: var(--sage); color: var(--forest); border-radius: 18px; padding: 18px 24px; font-weight: 700; box-shadow: 0 20px 50px rgba(0,0,0,.35); white-space: nowrap; }
  .frag small { display: block; font-weight: 600; color: #59685f; margin-bottom: 6px; letter-spacing: .04em; text-transform: uppercase; }
  .frag.q { background: #fff6dd; color: #6a4a10; }
  .frag.msg { background: #ffffff; border-radius: 18px 18px 18px 4px; }
  #hook { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; letter-spacing: -.045em; line-height: 1.02; text-shadow: 0 10px 40px rgba(0,0,0,.4); }
  #hook em { font-style: normal; color: var(--lime); }
  #illus { position: absolute; font-size: 20px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  /* End */
  #end { position: absolute; inset: 0; display: none; background: radial-gradient(circle at 50% 40%, #1d4a36 0, var(--deep) 65%); text-align: center; }
  #wordmark { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 26px; font-weight: 800; letter-spacing: -.04em; }
  #wordmark .icon { border: 6px solid var(--ink); border-radius: 14px; display: grid; place-items: center; }
  #wordmark .icon span { background: var(--lime); border-radius: 6px; }
  #tagline { position: absolute; left: 0; right: 0; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
  #url { position: absolute; left: 0; right: 0; font: 600 30px/1.2 Menlo, monospace; color: var(--lime); }
  #underline { position: absolute; height: 6px; background: var(--lime); border-radius: 3px; left: 50%; }
</style>
</head>
<body>
<div id="stage">
  <div id="panel"><img id="frame" alt=""><div id="searching"><div class="card"><div class="dots"><span></span><span></span><span></span></div><h3>Reading the Knowledge Base</h3><code>initial_context → knowledge_base_read</code></div></div></div>
  <div id="intro" class="layer"><div id="grid"></div></div>
  <div id="chips" class="layer"></div>
  <div id="punch"></div>
  <div id="caption"></div>
  <div id="end"><div id="wordmark"><div class="icon"><span></span></div><div>backstage</div></div><div id="tagline">Your next event starts here.</div><div id="underline"></div><div id="url">backstage-production-0849.up.railway.app</div></div>
  <div id="wipe"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const vertical = params.get("format") === "vertical";
const W = vertical ? 1080 : 1920, H = vertical ? 1920 : 1080;
document.documentElement.style.setProperty("--w", W + "px");
document.documentElement.style.setProperty("--h", H + "px");
let T = null, VO = {};
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outBack = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

// Layout boxes
const panelBox = vertical ? {x: 0, y: 400, w: 1080, h: 1180} : {x: 0, y: 0, w: 1920, h: 1080};
Object.assign($("panel").style, {left: panelBox.x + "px", top: panelBox.y + "px", width: panelBox.w + "px", height: panelBox.h + "px"});

// Intro fragments (illustrative)
const frags = [
  {cls: "", label: "Requirement", text: "30 founders · projector", x: 0.08, y: 0.18, vx: 0.06, vy: 0.1, at: 0.3},
  {cls: "msg", label: "Message", text: "Any space free on the 24th?", x: 0.62, y: 0.14, vx: 0.42, vy: 0.17, at: 0.9},
  {cls: "", label: "Date", text: "Sat 24 Oct · 10:00–12:00", x: 0.66, y: 0.62, vx: 0.48, vy: 0.66, at: 1.5},
  {cls: "q", label: "Unanswered", text: "Is outside food allowed?", x: 0.06, y: 0.66, vx: 0.05, vy: 0.29, at: 2.1},
  {cls: "msg", label: "Message", text: "Following up again…", x: 0.38, y: 0.80, vx: 0.1, vy: 0.77, at: 2.7},
  {cls: "q", label: "Unanswered", text: "Capacity by seating layout?", x: 0.40, y: 0.06, vx: 0.3, vy: 0.04, at: 3.3},
];
const fragEls = frags.map((f) => { const el = document.createElement("div"); el.className = "frag " + f.cls; el.innerHTML = `<small>${f.label}</small>${f.text}`; el.style.fontSize = (vertical ? 30 : 30) + "px"; $("intro").appendChild(el); return el; });
const orbs = [["#3c7d4f", 520, 0.2, 0.3], ["#a7d36b", 380, 0.8, 0.7], ["#2b6a54", 460, 0.6, 0.2]].map(([c, s, x, y]) => { const el = document.createElement("div"); el.className = "orb"; Object.assign(el.style, {background: c, width: s + "px", height: s + "px"}); $("intro").appendChild(el); return {el, s, x, y}; });
const hook = document.createElement("div"); hook.id = "hook"; $("intro").appendChild(hook);
const illus = document.createElement("div"); illus.id = "illus"; illus.textContent = "Illustration"; $("intro").appendChild(illus);

function camera(shot, p) {
  const keys = shot.cam;
  let a = keys[0], b = keys[keys.length - 1];
  for (let i = 0; i < keys.length - 1; i++) if (p >= keys[i][0] && p <= keys[i + 1][0]) { a = keys[i]; b = keys[i + 1]; break; }
  const k = a[0] === b[0] ? 0 : ease((p - a[0]) / (b[0] - a[0]));
  return {s: a[1] + (b[1] - a[1]) * k, cx: a[2] + (b[2] - a[2]) * k, cy: a[3] + (b[3] - a[3]) * k};
}

function placeFootage(cam) {
  // Vertical uses a square window; its scale is chosen so the region stays readable without upscaling much.
  const s = vertical ? clamp(cam.s * 0.9 + 0.25, 1.25, 1.8) : cam.s;
  const vw = panelBox.w / s, vh = panelBox.h / s;
  const cx = clamp(cam.cx, vw / 2, 1920 - vw / 2), cy = clamp(cam.cy, vh / 2, 1080 - vh / 2);
  $("frame").style.transform = `translate(${panelBox.w / 2 - cx * s}px, ${panelBox.h / 2 - cy * s}px) scale(${s})`;
}

function chip(text, style, cls = "chip", dot = true) {
  const el = document.createElement("div"); el.className = cls; el.innerHTML = (dot && cls === "chip" ? "<i></i>" : "") + text; Object.assign(el.style, style); $("chips").appendChild(el); return el;
}

function captionAt(t) {
  for (const [id, parts] of T.captions) {
    const vo = VO[id]; if (!vo) continue;
    if (t < vo.start || t > vo.end + 0.15) continue;
    const total = parts.reduce((n, s) => n + s.length, 0);
    let acc = vo.start;
    for (const part of parts) { const d = (vo.end - vo.start) * part.length / total; if (t <= acc + d + 0.15) return part; acc += d; }
    return parts[parts.length - 1];
  }
  return "";
}

window.setup = (timeline, vo) => { T = timeline; VO = vo; };

window.renderFrame = async (t) => {
  $("chips").innerHTML = "";
  const intro = t < 6.0, end = t >= 41.5;
  // ---------- Intro ----------
  $("intro").style.display = intro ? "block" : "none";
  if (intro) {
    $("grid").style.transform = `translate(${-t * 14}px, ${-t * 9}px)`;
    orbs.forEach((o, i) => { o.el.style.left = (o.x * W - o.s / 2 + Math.sin(t * 0.8 + i) * 40) + "px"; o.el.style.top = (o.y * H - o.s / 2 + Math.cos(t * 0.6 + i) * 30) + "px"; });
    frags.forEach((f, i) => {
      const k = outBack(win(t, f.at, f.at + 0.45)), leave = ease(win(t, 5.3, 5.95));
      const el = fragEls[i];
      const x = vertical ? f.vx * W : f.x * W, y = vertical ? f.vy * H : f.y * H;
      el.style.left = x + "px"; el.style.top = (y + (1 - k) * 40) + "px";
      el.style.opacity = String(Math.min(k, 1) * (1 - leave));
      el.style.transform = `scale(${0.85 + 0.15 * Math.min(k, 1.05)}) rotate(${(i % 2 ? 1 : -1) * 2 * (1 - k)}deg)`;
    });
    const hk = win(t, 0.5, 1.0), hk2 = win(t, 1.7, 2.2);
    hook.style.fontSize = (vertical ? 104 : 120) + "px";
    hook.style.top = (vertical ? 0.42 * H : 0.36 * H) + "px";
    hook.innerHTML = `<div style="opacity:${hk};transform:translateY(${(1 - ease(hk)) * 30}px)">Great idea.</div><div style="opacity:${hk2};transform:translateY(${(1 - ease(hk2)) * 30}px)">Where do we <em>host it?</em></div>`;
    hook.style.opacity = String(1 - ease(win(t, 5.4, 5.95)));
    Object.assign(illus.style, {left: (vertical ? 48 : 64) + "px", bottom: (vertical ? 240 : 48) + "px"});
  }
  // ---------- Footage ----------
  const shot = T.shots.find((s) => t >= s.out[0] && t < s.out[1]);
  $("panel").style.display = shot ? "block" : "none";
  $("searching").style.display = shot && shot.searching ? "flex" : "none";
  if (shot) {
    const p = (t - shot.out[0]) / (shot.out[1] - shot.out[0]);
    const count = shot.frames;
    const index = shot.freeze ? 1 : clamp(Math.floor((t - shot.out[0]) * T.fps) + 1, 1, count);
    const src = `build/frames/${shot.id}/${String(index).padStart(4, "0")}.jpg`;
    const img = $("frame");
    if (!img.src.endsWith(src)) { img.src = src; await img.decode().catch(() => {}); }
    const cam = camera(shot, p); if (vertical && shot.vdx) cam.cx += shot.vdx; placeFootage(cam);
    if (shot.searching) { const dots = $("searching").querySelectorAll(".dots span"); dots.forEach((d, i) => { d.style.opacity = String(0.35 + 0.65 * Math.max(0, Math.sin((t * 7) - i * 0.9))); }); }
  }
  // Vertical frame background accents
  document.body.style.background = "var(--deep)";
  // ---------- Section chrome ----------
  const section = T.sections.find((s) => t >= s.start && t < s.end);
  const punch = $("punch");
  punch.style.display = "none";
  if (section) {
    const enter = ease(win(t, section.start, section.start + 0.3));
    chip(section.chip, vertical ? {left: "48px", top: (110 - (1 - enter) * 20) + "px", opacity: enter, fontSize: "30px"} : {left: "40px", top: (110 - (1 - enter) * 20) + "px", opacity: enter});
    const at = section.punchAt ?? section.start; const pk = win(t, at + 0.15, at + 0.5), pout = vertical ? 0 : win(t, at + 1.9, at + 2.3);
    if (pk > 0 && pout < 1) {
      punch.style.display = "block";
      punch.textContent = section.punch;
      punch.style.fontSize = (vertical ? 58 : 46) + "px";
      punch.style.opacity = String(Math.min(pk * 1.4, 1) * (1 - pout));
      if (vertical) { Object.assign(punch.style, {left: "48px", top: (200 + (1 - ease(pk)) * 30) + "px", right: "auto", bottom: "auto"}); }
      else { Object.assign(punch.style, {left: "40px", top: "auto", bottom: (150 + (1 - ease(pk)) * 30) + "px", right: "auto"}); }
    }
  }
  if (t >= 13.6 && t < 21.8) {
    const k = ease(win(t, 13.6, 13.9));
    chip("Queries Sanity Context MCP", vertical ? {right: "48px", top: (96 - (1 - k) * 20) + "px", opacity: k, fontSize: "28px"} : {right: "40px", top: (110 - (1 - k) * 20) + "px", opacity: k}, "tag outline");
  }
  if (t >= 35.4 && t < 41.5) {
    const k = ease(win(t, 35.4, 35.7));
    chip("Demo hosts • simulated workflow", vertical ? {right: "48px", top: (96 - (1 - k) * 20) + "px", opacity: k, fontSize: "28px"} : {right: "40px", top: (110 - (1 - k) * 20) + "px", opacity: k}, "tag");
  }
  if (t >= 29.6 && t < 35.4) {
    const k = ease(win(t, 29.8, 30.1));
    chip("Private draft · not a booking", vertical ? {right: "48px", top: (96 - (1 - k) * 20) + "px", opacity: k, fontSize: "28px"} : {right: "40px", top: (110 - (1 - k) * 20) + "px", opacity: k}, "tag outline");
  }
  // ---------- End frame ----------
  $("end").style.display = end ? "block" : "none";
  if (end) {
    const k = outBack(win(t, 41.5, 42.0)), k2 = ease(win(t, 42.0, 42.5)), k3 = ease(win(t, 42.5, 43.0));
    const wm = $("wordmark"); wm.style.fontSize = (vertical ? 130 : 150) + "px"; wm.style.top = (vertical ? 0.36 * H : 0.30 * H) + "px"; wm.style.transform = `scale(${0.85 + 0.15 * k})`; wm.style.opacity = String(Math.min(1, k));
    const icon = wm.querySelector(".icon"); const iz = vertical ? 104 : 120; Object.assign(icon.style, {width: iz * 0.8 + "px", height: iz + "px"}); Object.assign(icon.querySelector("span").style, {width: iz * 0.28 + "px", height: iz * 0.36 + "px"});
    const tg = $("tagline"); tg.style.fontSize = (vertical ? 60 : 64) + "px"; tg.style.top = (vertical ? 0.36 * H + 220 : 0.30 * H + 240) + "px"; tg.style.opacity = String(k2); tg.style.transform = `translateY(${(1 - k2) * 20}px)`;
    const ul = $("underline"); ul.style.top = (vertical ? 0.36 * H + 320 : 0.30 * H + 340) + "px"; ul.style.width = (k3 * (vertical ? 520 : 640)) + "px"; ul.style.marginLeft = (-(k3 * (vertical ? 520 : 640)) / 2) + "px";
    const url = $("url"); url.style.fontSize = (vertical ? 30 : 32) + "px"; url.style.top = (vertical ? 0.36 * H + 370 : 0.30 * H + 380) + "px"; url.style.opacity = String(k3);
  }
  // ---------- Section wipes ----------
  const wipeAt = [5.8, 11.25, 13.72, 21.75, 29.55, 35.35, 41.3].find((w) => t >= w && t < w + 0.4);
  $("wipe").style.left = wipeAt === undefined ? "-140%" : `${-140 + ease(win(t, wipeAt, wipeAt + 0.4)) * 240}%`;
  // ---------- Captions ----------
  const cap = captionAt(t);
  const c = $("caption");
  c.style.display = cap ? "block" : "none";
  if (cap) {
    c.textContent = cap;
    Object.assign(c.style, vertical ? {bottom: "150px", fontSize: "40px", padding: "16px 26px", maxWidth: "960px", width: "max-content"} : {bottom: "48px", fontSize: "36px", padding: "14px 28px", maxWidth: "1500px", width: "max-content"});
  }
};
</script>
</body>
</html>
